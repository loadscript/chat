# Typecheck, test, and build the chat UI.
#
# The reusable harness client lives in `@loadscript/harness`; this package is the
# chat application layer on top of it. The companion server lives in
# `@underload/chat`.

name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24

            # No lockfile is committed, so `npm install` rather than `npm ci`.
            - name: Install dependencies
              run: npm install

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test

            - name: Build UI
              run: npm run build
